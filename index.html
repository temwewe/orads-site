    function ms(v) { return v >= 1000 ? (v / 1000).toFixed(1) + ' с' : Math.round(v) + ' мс'; }
    function show(why) {
      if (document.getElementById('ozDiag')) return;
      var n = performance.getEntriesByType('navigation')[0] || {}, rows = [];
      rows.push(['Заход на сайт №' + visits + ' в этой вкладке', '']);
      rows.push(['Всего с первого открытия', ms(Date.now() - t0)]);
      rows.push(['Эта страница: всего', ms(performance.now())]);
      if (n.domainLookupEnd) rows.push(['Поиск адреса (DNS)', ms(n.domainLookupEnd - n.domainLookupStart)]);
      if (n.connectEnd) rows.push(['Соединение', ms(n.connectEnd - n.connectStart)]);
      if (n.responseStart) rows.push(['Ответ сервера', ms(n.responseStart - n.requestStart)]);

        if (r.duration < 150) return;
        var u = r.name.replace(/^https?:\/\//, '').replace(/\?.*/, ''); if (u.length > 46) u = u.slice(0, 22) + '…' + u.slice(-22);
        rows.push([u, ms(r.duration)]);
      });
      rows.push(['Причина показа', why]);
      var d = document.createElement('div'); d.id = 'ozDiag';
      d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#fff;color:#111;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px 14px;font:13px/1.35 -apple-system,system-ui,sans-serif;max-height:80vh;overflow:auto';
      d.innerHTML = '<b style="font-size:15px">Замер скорости</b> <button style="float:right;border:0;background:#eee;border-radius:8px;padding:4px 10px" onclick="sessionStorage.removeItem(\'oz_diag\');this.parentNode.remove()">✕</button><table style="width:100%;margin-top:8px;border-collapse:collapse">' +
        rows.map(function (r) { return '<tr><td style="padding:3px 0;border-top:1px solid #eee">' + r[0] + '</td><td style="text-align:right;white-space:nowrap;padding-left:8px;border-top:1px solid #eee"><b>' + r[1] + '</b></td></tr>'; }).join('') +
        '</table><div style="color:#777;margin-top:8px">Сделайте скриншот и пришлите.</div>';

<script>
(function () {
  // Как это работает:

  // 3) Робот раз в 3 дня меняет ключ и файл (пересланная ссылка перестаёт работать). Расшифрованная копия у врача остаётся.
  //    Новая версия справочника (c в version.json) или конец подписки → сайт ведёт за свежим пропуском через урок.

  var K = { a: 'orads_a', html: 'orads_html', v: 'orads_hv' };
  var ls = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },

  };
  var $ = function (id) { return document.getElementById(id); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(s) { var b = atob(s.trim()), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  // Пропуск из урока
  var m = location.hash.match(/[#&]a=([A-Za-z0-9_-]+)/);
  if (m) {
    try { var p = JSON.parse(new TextDecoder().decode(b64u(m[1]))); if (p.k && p.f && p.c) { ls.set(K.a, JSON.stringify(p)); if (typeof p.n === 'string') ls.set('orads_name', p.n.slice(0, 60)); if (typeof p.e === 'string' && /^[^@\s]+@[^@\s]+$/.test(p.e)) ls.set('orads_email', p.e.slice(0, 120)); } } catch (e) {}

    $('gLogin').hidden = !opts.login; $('gHint').hidden = !opts.login;

  }
  // Данные для вкладки «Профиль» и плашки «Нет сети» внутри справочника.
  function appData(offline) {
    var p = pass() || {};
    window.OZAPP = { offline: !!offline, exp: p.exp || null, c: p.c || null, buy: 'https://store.timofeeva-online.ru/orads-pay',
      school: 'https://school.timofeeva-online.ru/', support: 'https://school.timofeeva-online.ru/?go=support', name: ls.get('orads_name') || '', email: ls.get('orads_email') || '', supportForm: 'https://store.timofeeva-online.ru/sw/0qV3eAeyn02sITPVUrUm4Q', standalone: !!standalone, install: function () { install(); } };
  }
  function setOffline(off) {
    if (!window.OZAPP) return;
    window.OZAPP.offline = off;
    if (!APPMODE) $('offBar').hidden = !off;
    try { window.dispatchEvent(new Event('ozapp')); } catch (e) {}
  }
  window.addEventListener('offline', function () { setOffline(true); });
  window.addEventListener('online', function () { setOffline(false); });
  var APPMODE = false; // новый справочник с нижними вкладками: шапку, «Нет сети» и профиль рисует он сам
  function show(html, offline) {
    $('gate').hidden = true; $('app').hidden = false; loaderDone();

      for (var i = 0; i < o.attributes.length; i++) n.setAttribute(o.attributes[i].name, o.attributes[i].value);
      n.textContent = o.textContent; o.replaceWith(n);

  }
  // Картинки справочника заранее сохраняем на телефон, чтобы они открывались и без сети (видео — нет, оно слишком большое).
  function precache(html) {
    if (!navigator.serviceWorker) return;
    var urls = {}, re = /https:\/\/[^"'\s)<>`]+?\.(?:jpe?g|png|webp|gif|svg)(?:\?[^"'\s)<>`]*)?/gi, m;

  // Экран загрузки: силуэт справочника с бликом + плашка с «эхо» вокруг значка (как в групповом чате).
  var LD = null;

  }

  var CHK = null;
  function checking(on) {

      CHK.innerHTML = '<span class="oz-er"><i></i><i></i><i></i><img src="icon-192.png" alt=""></span>Проверяем подписку';

  function needKey(msg) {

        }
      }, { passive: false });
      o.addEventListener('touchend', function (e) {
        if (!st || e.touches.length) return;
        if (!st.pinch && sc === 1) { if (ty > 120) return close(); ty = 0; o.style.background = ''; apply(true); }
        st = null;
      });
      o.addEventListener('wheel', function (e) { e.preventDefault(); sc = Math.min(6, Math.max(1, sc * (e.deltaY < 0 ? 1.15 : 0.87))); if (sc === 1) tx = ty = 0; apply(false); }, { passive: false });
      o.addEventListener('click', function (e) { if (e.target === o) close(); });
    }
  })();
})();
