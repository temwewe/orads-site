name: Правка страницы сайта (разовая)
on:
  push:
    branches: [claude/project-thread-lqz9vs]
    paths: ['.github/workflows/page-patch.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ${{ secrets.API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/page-patch.mjs
