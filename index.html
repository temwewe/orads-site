(function () {

  var d = document, H = d.documentElement; H.classList.add('tgib');
  function B() { return d.body; }
  function y() { return B() ? B().scrollTop : 0; }
  function to(a, b) { var o = (a && typeof a === 'object') ? a : { left: a, top: b }; if (B()) B().scrollTo({ top: +o.top || 0, left: 0, behavior: o.behavior === 'smooth' ? 'smooth' : 'auto' }); }

})();
