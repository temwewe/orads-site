name: Правка урока справочника
on:
  push:
    branches: [claude/project-thread-lqz9vs]   # ВРЕМЕННО: разовый запуск
    paths: [tools/lesson-patch.mjs, .github/workflows/lesson-patch.yml]
  workflow_dispatch: {}
concurrency:
  group: rotate
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/lesson-patch.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
