<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Справочник O-RADS US · Тимофеева онлайн</title>
<meta name="theme-color" content="#752b2d">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O-RADS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--brand:#752b2d;--ink:#1d1d1f;--mu:#86868b}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f5f7;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#gate{min-height:100vh;display:flex;flex-direction:column}
.hd{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;font-weight:600;letter-spacing:.02em}
.box{max-width:460px;margin:48px auto;padding:32px 26px;background:#fff;border-radius:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ic{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;display:block}
.t{font-size:1.4rem;font-weight:700;margin:0 0 6px}
.p{color:#555;margin:0 0 22px}
.b{display:block;width:100%;padding:14px;border-radius:14px;border:0;font:600 1rem/1.2 inherit;text-decoration:none;cursor:pointer;margin-top:10px}
.pr{background:var(--brand);color:#fff}.gh{background:#f1eaea;color:var(--brand)}
.sm{font-size:.82rem;color:var(--mu);margin-top:18px}
#app[hidden],#gate[hidden],.x[hidden]{display:none}
.ft{max-width:900px;margin:0 auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;color:var(--mu);font-size:.82rem}
.ft button{border:0;background:none;color:var(--brand);font:600 .82rem inherit;cursor:pointer;padding:2px}
.off{position:sticky;top:0;z-index:70;background:#fff4d6;color:#6b5100;text-align:center;font-size:.82rem;padding:6px 10px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:90}
.sheet>div{background:#fff;border-radius:22px 22px 0 0;max-width:520px;width:100%;padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
.sheet ol{padding-left:20px;margin:10px 0 0}.sheet li{margin:6px 0}
</style>
</head>
<body>
<div id="gate">
  <div class="hd">TIMOFEEVA-ONLINE</div>
  <div class="box">
    <img class="ic" src="icon-192.png" alt="">
    <p class="t">Справочник O-RADS US</p>
    <p class="p" id="gMsg">Открываем справочник…</p>
    <a class="b pr x" id="gLogin" hidden href="https://school.timofeeva-online.ru/learn/MsUmf5w010u7GnQxUhiGHg/theory?app=1">Открыть через школу</a>
    <a class="b gh x" id="gBuy" hidden href="https://store.timofeeva-online.ru/orads#buy">Оформить подписку</a>
    <button class="b gh x" id="gRetry" hidden>Попробовать ещё раз</button>
    <p class="sm x" id="gHint" hidden>Справочник откроется из урока в личном кабинете школы «Тимофеева онлайн». Нужна активная подписка.</p>
  </div>
</div>
<div id="app" hidden>
  <div class="off" id="offBar" hidden>Нет сети: открыта сохранённая копия справочника</div>
  <div id="appBody"></div>
  <div class="ft"><span id="who"></span><button id="bInstall" hidden>Установить на телефон</button><button id="bOut">Выйти</button></div>
</div>
<script>
window.onerror = function (m, src, line) { var g = document.getElementById('gMsg'); if (g) g.textContent = 'Ошибка: ' + m + ' (' + line + ')'; };
</script>
<script>
(function () {
  // Как это работает:
  // 1) Урок в школе (доступ проверяет Prodamus) отправляет сюда ссылку #a=<пропуск>: ключ, адрес зашифрованного файла, версия.
  // 2) Сайт скачивает зашифрованный справочник из «Файлов» Prodamus и расшифровывает его ключом.
  //    В пропуске и дата окончания подписки (exp) — до неё справочник работает со значка, в том числе без сети.
  // 3) Робот раз в 3 дня меняет ключ и файл (пересланная ссылка перестаёт работать). Расшифрованная копия у врача остаётся.
  //    Новая версия справочника (c в version.json) или конец подписки → сайт ведёт за свежим пропуском через урок.
  var LESSON = 'https://school.timofeeva-online.ru/learn/MsUmf5w010u7GnQxUhiGHg/theory?app=1';
  var K = { a: 'orads_a', html: 'orads_html', v: 'orads_hv' };
  var ls = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(s) { var b = atob(s.trim()), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  // Пропуск из урока
  var m = location.hash.match(/[#&]a=([A-Za-z0-9_-]+)/);
  if (m) {
    try { var p = JSON.parse(new TextDecoder().decode(b64u(m[1]))); if (p.k && p.f && p.c) ls.set(K.a, JSON.stringify(p)); } catch (e) {}
    try { sessionStorage.removeItem('orads_go'); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function pass() { try { return JSON.parse(ls.get(K.a) || 'null'); } catch (e) { return null; } }

  function gate(msg, opts) {
    opts = opts || {};
    $('app').hidden = true; $('gate').hidden = false;
    $('gMsg').textContent = msg;
    $('gLogin').hidden = !opts.login; $('gHint').hidden = !opts.login;
    $('gBuy').hidden = !opts.buy; $('gRetry').hidden = !opts.retry;
  }
  function show(html, offline) {
    $('gate').hidden = true; $('app').hidden = false;
    $('offBar').hidden = !offline;
    var box = $('appBody');
    box.innerHTML = html;
    box.querySelectorAll('script').forEach(function (o) {
      var n = document.createElement('script');
      for (var i = 0; i < o.attributes.length; i++) n.setAttribute(o.attributes[i].name, o.attributes[i].value);
      n.textContent = o.textContent; o.replaceWith(n);
    });
  }
  function wipe() { [K.a, K.html, K.v].forEach(ls.del); }

  // Нужен новый ключ: один раз сами ведём через урок, дальше — кнопка.
  function needKey(msg) {
    wipe();
    var went = false; try { went = !!sessionStorage.getItem('orads_go'); } catch (e) {}
    if (!went && navigator.onLine !== false) { try { sessionStorage.setItem('orads_go', '1'); } catch (e) {} location.href = LESSON; return; }
    gate(msg, { login: true, buy: true });
  }

  function withTimeout(url, ms) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    return fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  }

  function decryptFrom(p) {
    return withTimeout(p.f, 30000).then(function (r) { if (!r.ok) throw new Error('файл ' + r.status); return r.text(); })
      .then(function (t) {
        var all = b64(t);
        return crypto.subtle.importKey('raw', b64(p.k), 'AES-GCM', false, ['decrypt']).then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12));
        });
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  var GRACE = 3 * 864e5; // запас после окончания подписки, если нет интернета
  function expired(p) { return p.exp && Date.now() > Date.parse(p.exp); }
  function deadOffline(p) { return p.exp && Date.now() > Date.parse(p.exp) + GRACE; }

  // version.json: {c: версия справочника, v: версия ключа}. Новая версия справочника → нужен свежий пропуск из урока.
  function checkVersion(p) {
    return withTimeout('version.json?t=' + Date.now(), 15000).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.c && j.c > (ls.get(K.v) || p.c || '')) { needKey('Вышло обновление справочника. Откройте его через школу.'); return false; }
        return true;
      })
      .catch(function () { return true; }); // нет сети — работаем с копией
  }

  function load() {
    var p = pass();
    if (!p) return gate('Справочник доступен по подписке. Откройте его через личный кабинет школы.', { login: true, buy: true });
    var html = ls.get(K.html);
    var online = navigator.onLine !== false;
    if (expired(p)) {
      if (online) return needKey('Срок подписки закончился. Если вы её продлили, откройте справочник через школу.');
      if (html && !deadOffline(p)) return show(html, true);
      wipe();
      return gate('Срок подписки закончился. Подключитесь к интернету и откройте справочник через школу.', { login: true, buy: true });
    }
    if (html && ls.get(K.v) === p.c) {
      show(html, !online);
      checkVersion(p);
      return;
    }
    gate('Открываем справочник…');
    checkVersion(p).then(function (ok) {
      if (!ok) return;
      return decryptFrom(p).then(function (h) {
        ls.set(K.html, h); ls.set(K.v, p.c);
        show(h, false);
      }, function (e) {
        if (e && (e.name === 'OperationError' || /файл 40/.test(e.message))) return needKey('Доступ к справочнику нужно обновить. Откройте его через школу.');
        if (html) return show(html, true);
        gate('Справочник не загрузился (' + ((e && (e.name + ': ' + e.message)) || 'нет ответа') + '). Проверьте интернет и нажмите «Попробовать ещё раз».', { retry: true });
      });
    });
  }

  $('gRetry').onclick = load;
  $('bOut').onclick = function () { wipe(); gate('Вы вышли. Чтобы снова открыть справочник, откройте его через школу.', { login: true }); };

  var deferred = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('bInstall').hidden = false; });
  if (ios && !standalone) $('bInstall').hidden = false;
  $('bInstall').onclick = function () {
    if (deferred) { deferred.prompt(); deferred = null; $('bInstall').hidden = true; return; }
    var d = document.createElement('div');
    d.className = 'sheet';
    d.innerHTML = '<div><p class="t" style="font-size:1.15rem">Значок на экране «Домой»</p><ol><li>Нажмите кнопку «Поделиться» (квадрат со стрелкой). В Яндекс Браузере — меню ☰ → «Добавить на экран „Домой“».</li><li>Выберите «На экран „Домой“».</li><li>Нажмите «Добавить».</li></ol><button class="b pr">Понятно</button></div>';
    d.onclick = function (e) { if (e.target === d || e.target.tagName === 'BUTTON') d.remove(); };
    document.body.appendChild(d);
  };
  window.addEventListener('online', function () { var p = pass(); if (p) { if (expired(p)) load(); else checkVersion(p); } });
  load();
})();
</script>
</body>
</html>
