name: Смена ключа справочника
on:
  schedule:
    - cron: '17 1 */3 * *'   # раз в 3 дня, ~04:17 МСК
  push:
    branches: [main]
    paths: [update.enc]       # новая версия справочника
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: rotate
  cancel-in-progress: false
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/rotate.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
      - name: Сохранить version.json
        run: |
          git config user.name "orads-bot"
          git config user.email "orads-bot@users.noreply.github.com"
          git add -A version.json update.enc 2>/dev/null || git add -A
          git commit -m "Смена ключа справочника" || exit 0
          git push
