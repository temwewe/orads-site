name: Копия справочника в уроке
on:
  push:
    branches: [claude/project-thread-lqz9vs]   # ВРЕМЕННО: разовый запуск
    paths: [tools/lesson-copy.mjs, .github/workflows/lesson-copy.yml]
concurrency:
  group: rotate
  cancel-in-progress: false
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/lesson-copy.mjs
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DRY: '1'
