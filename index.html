<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Справочник O-RADS US · Тимофеева онлайн</title>
<meta name="theme-color" content="#752b2d">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="O-RADS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--brand:#752b2d;--ink:#1d1d1f;--mu:#86868b}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f5f7;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#gate{min-height:100vh;display:flex;flex-direction:column}
.oz-hd{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;font-weight:600;letter-spacing:.02em}
.oz-box{max-width:460px;margin:48px auto;padding:32px 26px;background:#fff;border-radius:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.oz-ic{width:72px;height:72px;border-radius:18px;margin:0 auto 16px;display:block}
.oz-t{font-size:1.4rem;font-weight:700;margin:0 0 6px}
.oz-p{color:#555;margin:0 0 22px}
.oz-b{display:block;width:100%;padding:14px;border-radius:14px;border:0;font:600 1rem/1.2 inherit;text-decoration:none;cursor:pointer;margin-top:10px}
.oz-pr{background:var(--brand);color:#fff}.oz-gh{background:#f1eaea;color:var(--brand)}
.oz-sm{font-size:.82rem;color:var(--mu);margin-top:18px}
#app[hidden],#gate[hidden],.oz-x[hidden]{display:none}
.oz-ft{max-width:900px;margin:0 auto;padding:14px 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;color:var(--mu);font-size:.82rem}
.oz-ft button{border:0;background:none;color:var(--brand);font:600 .82rem inherit;cursor:pointer;padding:2px}
.oz-off{position:sticky;top:0;z-index:70;background:#fff4d6;color:#6b5100;text-align:center;font-size:.82rem;padding:6px 10px}
.oz-sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:90}
.oz-sheet>div{background:#fff;border-radius:22px 22px 0 0;max-width:520px;width:100%;padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
.oz-zoom{position:fixed;inset:0;z-index:200;background:#000;touch-action:none;overflow:hidden;opacity:0;transition:opacity .2s}
.oz-zoom.on{opacity:1}
.oz-zoom img{position:absolute;left:50%;top:50%;max-width:100vw;max-height:100vh;transform-origin:center;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.oz-zoom button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:40px;cursor:pointer}
#ozSb img{cursor:zoom-in}
.oz-sheet ol{padding-left:20px;margin:10px 0 0}.oz-sheet li{margin:6px 0}
</style>
</head>
<body>
<div id="gate">
  <div class="oz-hd">TIMOFEEVA-ONLINE</div>
  <div class="oz-box">
    <img class="oz-ic" src="icon-192.png" alt="">
    <p class="oz-t">Справочник O-RADS US</p>
    <p class="oz-p" id="gMsg">Открываем справочник…</p>
    <a class="oz-b oz-pr oz-x" id="gLogin" hidden href="https://school.timofeeva-online.ru/learn/MsUmf5w010u7GnQxUhiGHg/theory?app=1">Открыть через школу</a>
    <a class="oz-b oz-gh oz-x" id="gBuy" hidden href="https://store.timofeeva-online.ru/orads#buy">Оформить подписку</a>
    <button class="oz-b oz-gh oz-x" id="gRetry" hidden>Попробовать ещё раз</button>
    <p class="oz-sm oz-x" id="gHint" hidden>Справочник откроется из урока в личном кабинете школы «Тимофеева онлайн». Нужна активная подписка.</p>
  </div>
</div>
<div id="app" hidden>
  <div class="oz-off" id="offBar" hidden>Нет сети: открыта сохранённая копия справочника</div>
  <div id="appBody"></div>
  <div class="oz-ft"><span id="who"></span><button id="bInstall" hidden>Установить на телефон</button><button id="bOut">Выйти</button></div>
</div>
<script>
window.onerror = function (m, src, line) { var g = document.getElementById('gMsg'); if (g) g.textContent = 'Ошибка: ' + m + ' (' + line + ')'; };
</script>
<script>
(function () {
  // Как это работает:
  // 1) Урок в школе (доступ проверяет Prodamus) отправляет сюда ссылку #a=<пропуск>: ключ, адрес зашифрованного файла, версия.
  // 2) Сайт скачивает зашифрованный справочник из «Файлов» Prodamus и расшифровывает его ключом.
  //    В пропуске и дата окончания подписки (exp) — до неё справочник работает со значка, в том числе без сети.
  // 3) Робот раз в 3 дня меняет ключ и файл (пересланная ссылка перестаёт работать). Расшифрованная копия у врача остаётся.
  //    Новая версия справочника (c в version.json) или конец подписки → сайт ведёт за свежим пропуском через урок.
  var LESSON = 'https://school.timofeeva-online.ru/learn/MsUmf5w010u7GnQxUhiGHg/theory?app=1';
  var K = { a: 'orads_a', html: 'orads_html', v: 'orads_hv' };
  var ls = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  var $ = function (id) { return document.getElementById(id); };
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  function b64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(s) { var b = atob(s.trim()), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  // Пропуск из урока
  var m = location.hash.match(/[#&]a=([A-Za-z0-9_-]+)/);
  if (m) {
    try { var p = JSON.parse(new TextDecoder().decode(b64u(m[1]))); if (p.k && p.f && p.c) ls.set(K.a, JSON.stringify(p)); } catch (e) {}
    try { sessionStorage.removeItem('orads_go'); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
  }
  function pass() { try { return JSON.parse(ls.get(K.a) || 'null'); } catch (e) { return null; } }

  function gate(msg, opts) {
    opts = opts || {};
    $('app').hidden = true; $('gate').hidden = false;
    $('gMsg').textContent = msg;
    $('gLogin').hidden = !opts.login; $('gHint').hidden = !opts.login;
    $('gBuy').hidden = !opts.buy; $('gRetry').hidden = !opts.retry;
  }
  function show(html, offline) {
    $('gate').hidden = true; $('app').hidden = false;
    $('offBar').hidden = !offline;
    var box = $('appBody');
    box.innerHTML = html;
    box.querySelectorAll('script').forEach(function (o) {
      var n = document.createElement('script');
      for (var i = 0; i < o.attributes.length; i++) n.setAttribute(o.attributes[i].name, o.attributes[i].value);
      n.textContent = o.textContent; o.replaceWith(n);
    });
  }
  // Картинки справочника заранее сохраняем на телефон, чтобы они открывались и без сети (видео — нет, оно слишком большое).
  function precache(html) {
    if (!navigator.serviceWorker) return;
    var urls = {}, re = /https:\/\/[^"'\s)<>`]+?\.(?:jpe?g|png|webp|gif|svg)(?:\?[^"'\s)<>`]*)?/gi, m;
    while ((m = re.exec(html))) urls[m[0].replace(/&amp;/g, '&')] = 1;
    var list = Object.keys(urls);
    if (list.length) navigator.serviceWorker.ready.then(function (r) { if (r.active) r.active.postMessage({ precache: list }); }).catch(function () {});
  }
  function wipe() { [K.a, K.html, K.v].forEach(ls.del); }

  // Нужен новый ключ: один раз сами ведём через урок, дальше — кнопка.
  function needKey(msg) {
    wipe();
    var went = false; try { went = !!sessionStorage.getItem('orads_go'); } catch (e) {}
    if (!went && navigator.onLine !== false) { try { sessionStorage.setItem('orads_go', '1'); } catch (e) {} location.href = LESSON; return; }
    gate(msg, { login: true, buy: true });
  }

  function withTimeout(url, ms) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    return fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
  }

  function decryptFrom(p) {
    return withTimeout(p.f, 30000).then(function (r) { if (!r.ok) throw new Error('файл ' + r.status); return r.text(); })
      .then(function (t) {
        var all = b64(t);
        return crypto.subtle.importKey('raw', b64(p.k), 'AES-GCM', false, ['decrypt']).then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: all.slice(0, 12) }, key, all.slice(12));
        });
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  var GRACE = 3 * 864e5; // запас после окончания подписки, если нет интернета
  function expired(p) { return p.exp && Date.now() > Date.parse(p.exp); }
  function deadOffline(p) { return p.exp && Date.now() > Date.parse(p.exp) + GRACE; }

  // version.json: {c: версия справочника, v: версия ключа}. Новая версия справочника → нужен свежий пропуск из урока.
  function checkVersion(p) {
    return withTimeout('version.json?t=' + Date.now(), 15000).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.c && j.c > (ls.get(K.v) || p.c || '')) { needKey('Вышло обновление справочника. Откройте его через школу.'); return false; }
        return true;
      })
      .catch(function () { return true; }); // нет сети — работаем с копией
  }

  function load() {
    var p = pass();
    if (!p) return gate('Справочник доступен по подписке. Откройте его через личный кабинет школы.', { login: true, buy: true });
    var html = ls.get(K.html);
    var online = navigator.onLine !== false;
    if (expired(p)) {
      if (online) return needKey('Срок подписки закончился. Если вы её продлили, откройте справочник через школу.');
      if (html && !deadOffline(p)) return show(html, true);
      wipe();
      return gate('Срок подписки закончился. Подключитесь к интернету и откройте справочник через школу.', { login: true, buy: true });
    }
    if (html && ls.get(K.v) === p.c) {
      show(html, !online);
      if (online) precache(html);
      checkVersion(p);
      return;
    }
    gate('Открываем справочник…');
    checkVersion(p).then(function (ok) {
      if (!ok) return;
      return decryptFrom(p).then(function (h) {
        ls.set(K.html, h); ls.set(K.v, p.c);
        show(h, false); precache(h);
      }, function (e) {
        if (e && (e.name === 'OperationError' || /файл 40/.test(e.message))) return needKey('Доступ к справочнику нужно обновить. Откройте его через школу.');
        if (html) return show(html, true);
        gate('Справочник не загрузился (' + ((e && (e.name + ': ' + e.message)) || 'нет ответа') + '). Проверьте интернет и нажмите «Попробовать ещё раз».', { retry: true });
      });
    });
  }

  $('gRetry').onclick = load;
  $('bOut').onclick = function () { wipe(); gate('Вы вышли. Чтобы снова открыть справочник, откройте его через школу.', { login: true }); };

  var deferred = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('bInstall').hidden = false; });
  if (ios && !standalone) $('bInstall').hidden = false;
  $('bInstall').onclick = function () {
    if (deferred) { deferred.prompt(); deferred = null; $('bInstall').hidden = true; return; }
    var d = document.createElement('div');
    d.className = 'oz-sheet';
    d.innerHTML = '<div><p class="oz-t" style="font-size:1.15rem">Значок на экране «Домой»</p><ol><li>Нажмите кнопку «Поделиться» (квадрат со стрелкой). В Яндекс Браузере — меню ☰ → «Добавить на экран „Домой“».</li><li>Выберите «На экран „Домой“».</li><li>Нажмите «Добавить».</li></ol><button class="oz-b oz-pr">Понятно</button></div>';
    d.onclick = function (e) { if (e.target === d || e.target.tagName === 'BUTTON') d.remove(); };
    document.body.appendChild(d);
  };
  window.addEventListener('online', function () { var p = pass(); if (p) { if (expired(p)) load(); else checkVersion(p); } });
  load();

  // Окно справочника: закрытие свайпом вниз (за полоску или когда окно прокручено к началу).
  (function () {
    var sh = null, y0 = 0, x0 = 0, dy = 0, t0 = 0, base = '', drag = false, decided = false;
    document.addEventListener('touchstart', function (e) {
      var s = document.getElementById('ozSheet');
      if (!s || !s.classList.contains('on') || !s.contains(e.target) || e.touches.length > 1) return;
      if (e.target.closest && e.target.closest('video, input, textarea, .oz-zoom')) return;
      var onGrip = e.target.closest && e.target.closest('.grip, .sh');
      if (!onGrip && s.scrollTop > 0) return;
      sh = s; y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; t0 = Date.now(); drag = false; decided = false;
      base = getComputedStyle(s).transform; if (base === 'none') base = '';
    }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (!sh) return;
      var d = e.touches[0].clientY - y0, dx = e.touches[0].clientX - x0;
      if (!decided) { if (Math.abs(d) < 6 && Math.abs(dx) < 6) return; decided = true; drag = d > 0 && Math.abs(d) > Math.abs(dx); if (!drag) { sh = null; return; } }
      if (sh.scrollTop > 0 && !(e.target.closest && e.target.closest('.grip, .sh'))) { sh = null; return; }
      dy = Math.max(0, d);
      e.preventDefault();
      sh.style.transition = 'none';
      sh.style.transform = base + ' translateY(' + dy + 'px)';
    }, { passive: false });
    document.addEventListener('touchend', function () {
      if (!sh) return;
      var s = sh; sh = null;
      if (!drag) return;
      var fast = dy / Math.max(1, Date.now() - t0) > 0.6;
      s.style.transition = '';
      if (dy > 110 || (fast && dy > 40)) {
        s.style.transform = base + ' translateY(' + (s.offsetHeight + 40) + 'px)';
        setTimeout(function () { var x = document.getElementById('ozX'); if (x) x.click(); s.style.transform = ''; }, 200);
      } else {
        s.style.transform = '';
      }
    });
  })();

  // Картинка во весь экран: нажатие на картинку в окне. Два пальца — увеличить, двойное касание — приблизить/вернуть, свайп вниз или ✕ — закрыть.
  (function () {
    document.addEventListener('click', function (e) {
      var img = e.target.closest && e.target.closest('#ozSb img');
      if (!img || e.target.closest('.oz-zoom')) return;
      e.preventDefault(); e.stopPropagation();
      open(img.currentSrc || img.src, img.alt);
    }, true);
    function open(src, alt) {
      var o = document.createElement('div'); o.className = 'oz-zoom';
      o.innerHTML = '<img alt=""><button aria-label="Закрыть">✕</button>';
      var im = o.querySelector('img'); im.src = src; im.alt = alt || '';
      document.body.appendChild(o); requestAnimationFrame(function () { o.classList.add('on'); });
      var sc = 1, tx = 0, ty = 0, st = null, lastTap = 0;
      function apply(anim) { im.style.transition = anim ? 'transform .2s' : 'none'; im.style.transform = 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) scale(' + sc + ')'; }
      function close() { o.classList.remove('on'); setTimeout(function () { o.remove(); }, 200); document.removeEventListener('keydown', key); }
      function key(e) { if (e.key === 'Escape') close(); }
      document.addEventListener('keydown', key);
      apply(false);
      o.querySelector('button').onclick = function (e) { e.stopPropagation(); close(); };
      function dist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
      o.addEventListener('touchstart', function (e) {
        var t = e.touches;
        if (t.length === 2) st = { d: dist(t), sc: sc, tx: tx, ty: ty, pinch: true };
        else if (t.length === 1) {
          var now = Date.now();
          if (now - lastTap < 300) { if (sc > 1) { sc = 1; tx = ty = 0; } else { sc = 2.5; tx = (innerWidth / 2 - t[0].clientX) * 1.5; ty = (innerHeight / 2 - t[0].clientY) * 1.5; } apply(true); lastTap = 0; st = null; return; }
          lastTap = now;
          st = { x: t[0].clientX, y: t[0].clientY, tx: tx, ty: ty, pinch: false, moved: false };
        }
      }, { passive: true });
      o.addEventListener('touchmove', function (e) {
        if (!st) return; e.preventDefault(); var t = e.touches;
        if (st.pinch && t.length === 2) { sc = Math.min(6, Math.max(1, st.sc * dist(t) / st.d)); if (sc === 1) { tx = ty = 0; } apply(false); return; }
        if (!st.pinch && t.length === 1) {
          var dx = t[0].clientX - st.x, dy = t[0].clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 8) st.moved = true;
          if (sc > 1) { tx = st.tx + dx; ty = st.ty + dy; } else { ty = Math.max(0, dy); o.style.background = 'rgba(0,0,0,' + Math.max(.3, 1 - ty / 400) + ')'; }
          apply(false);
        }
      }, { passive: false });
      o.addEventListener('touchend', function (e) {
        if (!st || e.touches.length) return;
        if (!st.pinch && sc === 1) { if (ty > 120) return close(); ty = 0; o.style.background = ''; apply(true); }
        st = null;
      });
      o.addEventListener('wheel', function (e) { e.preventDefault(); sc = Math.min(6, Math.max(1, sc * (e.deltaY < 0 ? 1.15 : 0.87))); if (sc === 1) tx = ty = 0; apply(false); }, { passive: false });
      o.addEventListener('click', function (e) { if (e.target === o) close(); });
    }
  })();
})();
</script>
</body>
</html>
